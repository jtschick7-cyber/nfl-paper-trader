name: Nightly Results

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Shared by the Master_Bets writers: sheet writes address rows by index (idx + 2), so runs must not overlap.
  group: sheet-writer
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      GSHEET_CREDENTIALS: ${{ secrets.GSHEET_CREDENTIALS }}
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      SEASON: "2026"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Restore odds cache for closing catch-up
        uses: actions/cache/restore@v4
        with:
          path: data/odds_cache
          key: ${{ runner.os }}-odds-cache-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-odds-cache-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Catch up any missed pre-kickoff closing lines
        run: python -m src.capture_closing

      - name: Update results
        run: python -m src.update_results

      - name: Compare models and update scorecard
        run: python -m src.compare_models
