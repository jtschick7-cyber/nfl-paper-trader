name: V3 Shadow Logger

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Shared by the Master_Bets writers: sheet writes address rows by index (idx + 2), so runs must not overlap.
  group: sheet-writer
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      GSHEET_CREDENTIALS: ${{ secrets.GSHEET_CREDENTIALS }}
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
      SEASON: "2026"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Restore odds cache
        uses: actions/cache/restore@v4
        with:
          path: data/odds_cache
          key: ${{ runner.os }}-odds-cache-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-odds-cache-

      - name: Restore play-by-play cache
        # Past seasons never change; the live season is re-downloaded whenever a completed
        # game_id is missing from it (src/build_features.py, P0-3).
        uses: actions/cache@v4
        with:
          path: data/epa_cache
          key: ${{ runner.os }}-pbp-cache-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-pbp-cache-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Refresh EPA features
        run: python -m src.build_features

      - name: Log v3 EPA shadow evaluations
        run: python -m src.log_v3_shadow

      - name: Log v4 full-matrix shadow evaluations
        run: python -m src.log_v4_shadow

      - name: Compare models and update scorecard
        run: python -m src.compare_models
