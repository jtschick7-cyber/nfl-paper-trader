name: V3 Shadow Logger

on:
  schedule:
    # Run on Tuesdays at 11:35 AM, 2:35 PM, 7:35 PM EDT (UTC 15:35, 18:35, 23:35)
    - cron: "35 15,18,23 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v3-shadow-logger
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      GSHEET_CREDENTIALS: ${{ secrets.GSHEET_CREDENTIALS }}
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
      SEASON: "2026"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Log v3 EPA shadow evaluations
        run: python -m src.log_v3_shadow
