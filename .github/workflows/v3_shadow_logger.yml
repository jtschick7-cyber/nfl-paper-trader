name: V3 Shadow Logger

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v3-shadow-logger
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      GSHEET_CREDENTIALS: ${{ secrets.GSHEET_CREDENTIALS }}
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
      SEASON: "2026"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Refresh EPA features
        run: python -m src.build_features

      - name: Log v3 EPA shadow evaluations
        run: python -m src.log_v3_shadow

      - name: Log v4 full-matrix shadow evaluations
        run: python -m src.log_v4_shadow

      - name: Compare models and update scorecard
        run: python -m src.compare_models
