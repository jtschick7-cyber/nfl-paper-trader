name: Migrate look-ahead openers (one-off)

# R1 migration step. Only needed if look-ahead openers for a week later than the
# current decision week were captured before R1 deployed. Dry-run unless "apply" is ticked.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Write to the Sheet (unticked = dry run)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sheet-writer
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      GSHEET_CREDENTIALS: ${{ secrets.GSHEET_CREDENTIALS }}
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
      SEASON: "2026"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Migrate look-ahead openers
        run: python -m src.migrate_lookahead_openers ${{ inputs.apply && '--apply' || '' }}
