name: Closing Line Monitor

on:
  schedule:
    # Every 5 minutes on Thu, Fri, Sat, Sun, Mon (UTC days 4,5,6,0,1)
    - cron: "*/5 * * * 4,5,6,0,1"
    # Early Tuesday for Monday Night Football (UTC hours 0-2)
    - cron: "*/5 0-2 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: closing-line-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      GSHEET_CREDENTIALS: ${{ secrets.GSHEET_CREDENTIALS }}
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      SEASON: "2026"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Restore odds cache
        uses: actions/cache@v4
        with:
          path: data/odds_cache
          key: ${{ runner.os }}-odds-cache-${{ github.run_number }}
          restore-keys: |
            ${{ runner.os }}-odds-cache-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Capture closing lines
        run: python -m src.capture_closing
