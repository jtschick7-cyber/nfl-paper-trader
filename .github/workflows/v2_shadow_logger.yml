name: V2 Shadow Logger

on:
  schedule:
    - cron: "30 15,18,23 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-shadow-logger
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      GSHEET_CREDENTIALS: ${{ secrets.GSHEET_CREDENTIALS }}
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
      SEASON: "2026"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Log v2 shadow evaluations
        run: python -m src.log_v2_shadow
