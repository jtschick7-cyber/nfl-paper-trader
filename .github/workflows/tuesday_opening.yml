name: Tuesday Opening Capture
on:
  schedule:
    - cron: '0 10,13,18 * * 2' # Tuesday 10:00, 13:00, 18:00 UTC
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - name: Sync Schedule
        env:
          GSHEET_CREDENTIALS: ${{ secrets.GSHEET_CREDENTIALS }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python -m src.fetch_schedule
      - name: Capture Opening Lines
        env:
          GSHEET_CREDENTIALS: ${{ secrets.GSHEET_CREDENTIALS }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python -m src.capture_opening
      - name: Generate Picks
        env:
          GSHEET_CREDENTIALS: ${{ secrets.GSHEET_CREDENTIALS }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: python -m src.generate_picks
