name: Tuesday Opening Capture

on:
  schedule:
    - cron: "0 15,18,23 * * 2"
    - cron: "0 18 * * 3,4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tuesday-opening
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      GSHEET_CREDENTIALS: ${{ secrets.GSHEET_CREDENTIALS }}
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      SEASON: "2026"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Restore odds cache
        uses: actions/cache@v4
        with:
          path: data/odds_cache
          key: ${{ runner.os }}-odds-cache-${{ github.run_number }}
          restore-keys: |
            ${{ runner.os }}-odds-cache-
            ${{ runner.os }}-odds-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch schedule
        run: python -m src.fetch_schedule

      - name: Capture opening lines
        run: python -m src.capture_opening

      - name: Generate picks
        run: python -m src.generate_picks

      - name: Log v2 shadow evaluations
        run: python -m src.log_v2_shadow

      - name: Refresh EPA features
        run: python -m src.build_features

      - name: Log v3 EPA shadow evaluations
        run: python -m src.log_v3_shadow

      - name: Log v4 full-matrix shadow evaluations
        run: python -m src.log_v4_shadow

      - name: Compare models and update scorecard
        run: python -m src.compare_models
